sonar.organization=nfcampaniolo
sonar.projectKey=nfcampaniolo_jurio

# --- Sorgenti ---
sonar.sources=src
sonar.tests=tests

# --- Test files ---
sonar.test.inclusions=tests/**/*.{test,spec}.{ts,tsx,js,jsx}

# --- Esclusioni dal codice analizzato ---
# esclude test utils, setup, d.ts e cartelle interne di test
sonar.exclusions=\
src/test/**,\
src/**/__tests__/**,\
**/*.d.ts,\
coverage/**,\
vitest.config.*,\
vite.config.*

# --- Esclusioni solo dalla coverage ---
# (mantieni il codice analizzato ma non penalizzi coverage su entrypoint ecc.)
sonar.coverage.exclusions=\
src/main.tsx,\
src/vite-env.d.ts,\
src/test/**,\
src/**/__tests__/**

# --- Coverage report ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info