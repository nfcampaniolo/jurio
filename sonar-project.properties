sonar.organization=nfcampaniolo
sonar.projectKey=nfcampaniolo_jurio
sonar.javascript.node.maxspace=6144

# --- Sorgenti ---
sonar.sources=functions/src
sonar.tests=tests/functions

# --- Test files ---
sonar.test.inclusions=tests/functions/**/*.{test,spec}.{ts,tsx,js,jsx}

# --- Esclusioni dal codice analizzato ---
# Esclude build outputs, dipendenze, file di configurazione e d.ts
sonar.exclusions=\
functions/node_modules/**,\
functions/lib/**,\
**/*.d.ts,\
coverage/**,\
vitest.config.*,\
vite.config.*,\
functions/tsconfig.json

# --- Esclusioni solo dalla coverage ---
# Evita penalizzazioni su entrypoint, file di setup dei test e codice compilato
sonar.coverage.exclusions=\
src/main.tsx,\
src/vite-env.d.ts,\
functions/lib/**,\
functions/src/index.ts,\
tests/**

# --- Coverage report ---
# Se generi un unico report lcov (es. tramite workspace o root runner)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info