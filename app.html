<!doctype html>
<html lang="it">
  <head>
    <!-- 1. Google Consent Mode v2: Imposta i default in 'denied' PRIMA di tutto -->
    <script type="text/javascript" src="https://embeds.iubenda.com/widgets/7f06adba-d6ba-41a7-9758-69f5297af96e.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Jurio" />
    
    <style>
      /* Stili nativi applicati prima che React carichi Tailwind */
      body { 
        margin: 0; 
        background-color: #ffffff; 
      }
      @media (prefers-color-scheme: dark) {
        body { 
          background-color: #171717; /* Corrisponde a bg-neutral-900 */
        } 
      }
      .initial-loader {
        display: flex; 
        height: 100vh; 
        width: 100vw; 
        align-items: center; 
        justify-content: center;
      }
      .spinner {
        width: 4rem; 
        height: 4rem; 
        border-radius: 9999px;
        border-top: 4px solid #171717; 
        border-bottom: 4px solid #171717;
        animation: spin 1s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .spinner { 
          border-color: #f5f5f4; 
        }
      }
      @keyframes spin { 
        100% { transform: rotate(360deg); } 
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Il browser disegna questo spinner istantaneamente -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- Quando main.tsx ha finito, React svuota #root e inietta Jurio -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
