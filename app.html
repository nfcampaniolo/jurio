<!doctype html>
<html lang="it">
  <head>
    <!-- 1. Google Consent Mode v2: Imposta i default in 'denied' PRIMA di tutto -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
    </script>

    <!-- 2. Cookiebot: Gestisce il banner e aggiorna il dataLayer in caso di consenso -->
    <script 
      id="Cookiebot" 
      src="https://consent.cookiebot.com/uc.js" 
      data-cbid="869d54bc-6b13-4281-a6ab-489dc313a855"  
      type="text/javascript"
    ></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Jurio" />
    
    <style>
      /* Stili nativi applicati prima che React carichi Tailwind */
      body { 
        margin: 0; 
        background-color: #ffffff; 
      }
      @media (prefers-color-scheme: dark) {
        body { 
          background-color: #171717; /* Corrisponde a bg-neutral-900 */
        } 
      }
      .initial-loader {
        display: flex; 
        height: 100vh; 
        width: 100vw; 
        align-items: center; 
        justify-content: center;
      }
      .spinner {
        width: 4rem; 
        height: 4rem; 
        border-radius: 9999px;
        border-top: 4px solid #171717; 
        border-bottom: 4px solid #171717;
        animation: spin 1s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .spinner { 
          border-color: #f5f5f4; 
        }
      }
      @keyframes spin { 
        100% { transform: rotate(360deg); } 
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Il browser disegna questo spinner istantaneamente -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- Quando main.tsx ha finito, React svuota #root e inietta Jurio -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
