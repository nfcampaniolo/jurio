<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Jurio — Instagram Carousel / Intro-Fine (Light Theme Ottimizzato)</title>
<!-- Google Fonts per rendering tipografico impeccabile ad alta risoluzione -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfdfd;
  --surface:#ffffff;
  --surface-2:#f3f4f6;
  --text:#0f1115;       /* Nero profondo per massima nitidezza */
  --muted:#535d6e;      /* Grigio scuro ben calibrato contro il light bleed */
  --gold:#c98516;       /* Oro con contrasto rafforzato per sfondi chiari */
  --gold-soft:rgba(201,133,22,.12);
  --line:#e2e5eb;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-serif:"Lora","Merriweather",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eaecf0;color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;display:grid;place-items:center;padding:24px}

/* Canvas standard Instagram Portrait 4:5 */
.slide{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:var(--bg);
  border:1px solid #cfd4dc;
  box-shadow:0 24px 48px rgba(15,23,42,0.06);
}

/* Texture di sfondo e griglia vettoriale */
.slide::before{
  content:"";
  position:absolute;
  inset:-15%;
  background:
    radial-gradient(circle at 84% 16%, rgba(201,133,22,.09), transparent 28%),
    radial-gradient(circle at 12% 84%, rgba(0,0,0,.03), transparent 26%);
  filter:blur(22px);
}
.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px);
  background-size:90px 90px;
  mask-image:linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
  opacity:.65;
}

/* Cornice grafica perimetrale */
.frame{
  position:absolute;
  inset:48px;
  border:1px solid var(--line);
  pointer-events:none;
}
.corner{
  position:absolute;
  width:140px;
  height:140px;
  border-top:1.5px solid rgba(201,133,22,.45);
  border-right:1.5px solid rgba(201,133,22,.45);
  top:48px;
  right:48px;
}
.corner.bottom{
  top:auto;
  right:auto;
  bottom:48px;
  left:48px;
  transform:rotate(180deg);
}

/* Top bar: dimensioni incrementate per lettura istantanea */
.top{
  position:absolute;
  left:84px;
  right:84px;
  top:72px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:2;
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  font-size:22px;
  font-weight:800;
  letter-spacing:.02em;
  color:var(--text);
}
.brand-mark{
  width:20px;
  height:20px;
  border:2px solid var(--gold);
  border-radius:50%;
  position:relative;
}
.brand-mark::after{
  content:"";
  position:absolute;
  inset:3.5px;
  border-radius:50%;
  background:var(--gold);
}
.meta{
  font-size:15px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

/* Contenuto principale: sfrutta l'altezza verticale disponibile */
.content{
  position:absolute;
  left:84px;
  right:84px;
  top:150px;
  bottom:130px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  z-index:2;
}

/* Eyebrow sopra al titolo */
.eyebrow{
  display:flex;
  align-items:center;
  gap:16px;
  color:var(--gold);
  font-size:17px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:28px;
}
.eyebrow::before{
  content:"";
  width:48px;
  height:2px;
  background:currentColor;
  opacity:.9;
}

/* Titolo H1 principale */
h1{
  margin:0;
  max-width:920px;
  font-family:var(--font-serif);
  font-weight:500;
  font-size:92px;
  line-height:1.04;
  letter-spacing:-.045em;
  color:var(--text);
}
h1 em{
  font-style:italic;
  color:var(--gold);
}

/* Testo di supporto / Lead: ora visibile e leggibile senza sforzo */
.lead{
  margin:36px 0 0;
  max-width:910px;
  font-size:34px;
  line-height:1.44;
  font-weight:400;
  color:#344054;
}
.lead strong{
  color:var(--text);
  font-weight:700;
}

/* Badge statement centrale (usato nell'intro) */
.statement{
  display:inline-flex;
  align-items:center;
  gap:14px;
  margin-top:44px;
  padding:16px 24px;
  border:1.5px solid var(--line);
  background:var(--surface);
  font-size:16px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#1e293b;
  width:max-content;
  border-radius:6px;
  box-shadow:0 3px 8px rgba(0,0,0,0.03);
}
.statement span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 6px var(--gold-soft);
}

/* Blocco Call-to-Action in basso */
.cta{
  max-width:920px;
  margin-top:48px;
  padding-top:28px;
  border-top:1.5px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:32px;
}
.cta-copy{
  font-size:22px;
  line-height:1.45;
  color:var(--muted);
  font-weight:500;
  max-width:600px;
}
.cta-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:18px 32px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:#ffffff;
  font-size:20px;
  font-weight:800;
  letter-spacing:.02em;
  text-decoration:none;
  white-space:nowrap;
  border-radius:6px;
  box-shadow:0 6px 18px rgba(201,133,22,.28);
}

/* Footer con numbering e dominio */
.footer{
  position:absolute;
  left:84px;
  right:84px;
  bottom:68px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  z-index:2;
}
.footer-left,.footer-right{
  font-size:15px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:750;
}

/* Filigrana grafica circolare di sfondo */
.center-mark{
  position:absolute;
  right:70px;
  top:180px;
  width:260px;
  height:260px;
  border-radius:50%;
  border:1px solid rgba(201,133,22,.3);
  box-shadow:0 0 0 28px rgba(201,133,22,.04),0 0 0 60px rgba(201,133,22,.02);
  pointer-events:none;
}
.center-mark::before,.center-mark::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:var(--gold);
  transform:translate(-50%,-50%);
}
.center-mark::before{width:1px;height:260px;opacity:.4;}
.center-mark::after{height:1px;width:260px;opacity:.4;}

/* Ottimizzazione specifica per modalità "fine": bilanciamento centrale anziché collassare in basso */
.mode-fine h1{
  max-width:920px;
  font-size:86px;
  line-height:1.06;
}
.mode-fine .lead{
  font-size:36px;
  max-width:920px;
}
.mode-fine .content{
  justify-content:center;
  padding-bottom:0;
}
</style>
</head>
<body>
<div class="slide" id="slide">
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="corner"></div>
  <div class="corner bottom"></div>
  <div class="center-mark"></div>

  <div class="top">
    <div class="brand"><span class="brand-mark"></span><span id="brand">Jurio</span></div>
    <div class="meta" id="meta">AI &amp; diritto</div>
  </div>

  <main class="content">
    <div class="eyebrow" id="eyebrow">Approfondimento</div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="statement" id="statement"><span></span><b id="statementText"></b></div>
    <div class="cta" id="cta">
      <div class="cta-copy" id="ctaCopy"></div>
      <a class="cta-button" id="ctaButton" href="#">Scopri Jurio <span style="margin-left:8px">↗</span></a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-left" id="footerLeft">jurio.it</div>
    <div class="footer-right" id="footerRight">07 / 07</div>
  </footer>
</div>

<script>
/* =========================================================
   CONFIGURAZIONE — modifica questo oggetto per ogni post
   mode: "intro" oppure "fine"
   ========================================================= */
const CONFIG = {
  mode: "fine",
  brand: "Jurio",
  meta: "AI & Diritto",
  eyebrow: "In sintesi",
  title: "Jurio diventa <em>un'infrastruttura.</em>",
  lead: "Non solo un luogo dove fare ricerca, ma una fonte giuridica che puoi portare negli strumenti AI di tutti i giorni.",
  statement: "",
  ctaCopy: "Conoscenza giuridica. Intelligenza artificiale. Accesso senza confini.",
  ctaLabel: "Scopri Jurio",
  ctaHref: "https://www.jurio.it",
  footerLeft: "jurio.it",
  footerRight: "07 / 07"
};

const el = id => document.getElementById(id);

// Gestione classe modalità
document.body.classList.toggle('mode-fine', CONFIG.mode === 'fine');

// Popolamento dinamico
el('brand').textContent = CONFIG.brand;
el('meta').textContent = CONFIG.meta;
el('eyebrow').textContent = CONFIG.eyebrow || (CONFIG.mode === 'fine' ? 'In sintesi' : 'Approfondimento');
el('title').innerHTML = CONFIG.title;
el('lead').innerHTML = CONFIG.lead;

// Gestione condizionale dello statement centrale
if (!CONFIG.statement || CONFIG.mode === 'fine') {
  el('statement').style.display = 'none';
} else {
  el('statement').style.display = 'inline-flex';
  el('statementText').textContent = CONFIG.statement;
}

el('ctaCopy').textContent = CONFIG.ctaCopy;
el('ctaButton').innerHTML = CONFIG.ctaLabel + ' <span style="margin-left:8px">↗</span>';
el('ctaButton').href = CONFIG.ctaHref;
el('footerLeft').textContent = CONFIG.footerLeft;
el('footerRight').textContent = CONFIG.footerRight;
</script>
</body>
</html>
