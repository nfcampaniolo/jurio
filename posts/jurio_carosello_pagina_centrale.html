<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Jurio — Instagram Carousel / Pagina Centrale (Dark Theme Ottimizzato)</title>
<!-- Google Fonts per rendering nitido ad alta risoluzione -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10;
  --surface:#14161a;
  --surface-2:#191b20;
  --text:#f8fafc;       /* Bianco puro per eliminare sgranature su schermi OLED */
  --muted:#94a3b8;      /* Grigio slate medio ad alto contrasto */
  --gold:#e0a32e;
  --gold-soft:rgba(224,163,46,.14);
  --line:#262a32;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-serif:"Lora","Merriweather",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#060708;color:var(--text);font-family:var(--font-sans)}
body{min-height:100vh;display:grid;place-items:center;padding:24px}

/* Canvas Instagram Portrait 4:5 */
.slide{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:var(--bg);
  border:1px solid #1e2229;
  box-shadow:0 24px 48px rgba(0,0,0,0.5);
}

/* Texture e griglia di fondo */
.slide::before{
  content:"";
  position:absolute;
  inset:-15%;
  background:
    radial-gradient(circle at 88% 12%, rgba(224,163,46,.13), transparent 26%),
    radial-gradient(circle at 0% 100%, rgba(255,255,255,.045), transparent 28%);
  filter:blur(22px);
}
.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
  background-size:90px 90px;
  opacity:.45;
  mask-image:linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
}

/* Cornice perimetrale */
.frame{
  position:absolute;
  inset:48px;
  border:1px solid var(--line);
  pointer-events:none;
}

/* Header superiore */
.top{
  position:absolute;
  left:84px;
  right:84px;
  top:72px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:3;
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  font-size:22px;
  font-weight:800;
  letter-spacing:.02em;
  color:var(--text);
}
.brand-mark{
  width:20px;
  height:20px;
  border:2px solid var(--gold);
  border-radius:50%;
  position:relative;
}
.brand-mark::after{
  content:"";
  position:absolute;
  inset:3.5px;
  border-radius:50%;
  background:var(--gold);
}
.meta{
  font-size:15px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

/* Corpo centrale: riempie l'altezza ed espande il contenitore a 880px */
.content{
  position:absolute;
  left:84px;
  right:84px;
  top:150px;
  bottom:130px;
  display:grid;
  grid-template-columns:84px 1fr;
  column-gap:36px;
  z-index:3;
}

/* Indicatore numerico della slide */
.index{
  padding-top:10px;
  color:var(--gold);
  font-size:18px;
  font-weight:850;
  letter-spacing:.14em;
}
.index::after{
  content:"";
  display:block;
  width:42px;
  height:2px;
  background:var(--gold);
  margin-top:22px;
  opacity:.8;
}

.main{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

/* Eyebrow tematica */
.eyebrow{
  font-size:16px;
  font-weight:850;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:20px;
}

/* Titolo H2: scalato a 76px per leggibilità mobile */
h2{
  margin:0;
  max-width:820px;
  font-family:var(--font-serif);
  font-size:76px;
  font-weight:500;
  line-height:1.05;
  letter-spacing:-.045em;
  color:var(--text);
}
h2 em{
  color:var(--gold);
  font-style:italic;
}

/* Testo principale: scalato a 30px */
.text{
  margin:28px 0 0;
  max-width:820px;
  font-size:30px;
  line-height:1.45;
  color:#e2e8f0;
  font-weight:400;
}
.text strong{
  color:var(--text);
  font-weight:700;
}

/* Divisore dorato */
.rule{
  width:100%;
  max-width:820px;
  height:1.5px;
  background:var(--line);
  margin:34px 0 28px;
  position:relative;
}
.rule::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:110px;
  height:1.5px;
  background:var(--gold);
}

/* Griglia dei punti: spaziatura e pesi maggiorati */
.points{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 36px;
  max-width:820px;
}
.point{
  padding:18px 0 0;
  border-top:1.5px solid var(--line);
}
.point-num{
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:850;
  color:var(--gold);
  margin-bottom:8px;
}
.point-title{
  font-size:21px;
  font-weight:750;
  line-height:1.3;
  color:var(--text);
  margin-bottom:6px;
}
.point-desc{
  font-size:17px;
  line-height:1.48;
  color:#bac4d1;
  font-weight:400;
}

/* Box callout finale: solido e nitido su sfondo scuro */
.callout{
  margin-top:36px;
  max-width:820px;
  border:1.5px solid var(--line);
  background:var(--surface);
  padding:22px 26px;
  display:flex;
  align-items:flex-start;
  gap:16px;
  border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.callout-dot{
  width:9px;
  height:9px;
  background:var(--gold);
  border-radius:50%;
  margin-top:9px;
  flex:none;
  box-shadow:0 0 0 6px var(--gold-soft);
}
.callout-text{
  font-size:22px;
  line-height:1.48;
  color:#e2e8f0;
}
.callout-text strong{
  font-weight:750;
  color:var(--text);
}

/* Footer inferiore */
.footer{
  position:absolute;
  left:84px;
  right:84px;
  bottom:68px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  z-index:4;
}
.footer-left,.footer-right{
  font-size:15px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:750;
}

/* Orbita decorativa di sfondo */
.orbit{
  position:absolute;
  right:50px;
  top:220px;
  width:320px;
  height:320px;
  border:1px solid rgba(224,163,46,.25);
  border-radius:50%;
  box-shadow:0 0 0 28px rgba(224,163,46,.02),0 0 0 60px rgba(224,163,46,.01);
  pointer-events:none;
}
.orbit::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:6px;
  height:6px;
  background:var(--gold);
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 0 10px rgba(224,163,46,.12);
}
.orbit::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:1px;
  height:320px;
  background:rgba(224,163,46,.25);
  transform:translate(-50%,-50%) rotate(45deg);
}

@media (max-width:900px){body{place-items:start}.slide{transform-origin:top left;transform:scale(.7)}}
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="orbit"></div>

  <header class="top">
    <div class="brand"><span class="brand-mark"></span><span id="brand">Jurio</span></div>
    <div class="meta" id="meta">Approfondimento</div>
  </header>

  <main class="content">
    <div class="index" id="index">02</div>
    <section class="main">
      <div class="eyebrow" id="eyebrow">Come funziona</div>
      <h2 id="title"></h2>
      <p class="text" id="text"></p>
      <div class="rule" id="rule"></div>
      <div class="points" id="points"></div>
      <div class="callout" id="callout">
        <div class="callout-dot"></div>
        <div class="callout-text" id="calloutText"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-left" id="footerLeft">jurio.it</div>
    <div class="footer-right" id="footerRight">02 / 08</div>
  </footer>
</div>

<script>
/* =========================================================
   CONFIGURAZIONE — inserisci qui i dati della slide
   ========================================================= */
const CONFIG = {
  brand: "Jurio",
  meta: "Verificabilità",
  index: "06",
  eyebrow: "02. RAG",
  title: "Una risposta <em>verificabile.</em>",
  text: "Il valore del RAG è portare le fonti dentro il processo di elaborazione dell'AI.",
  points: [],
  callout: "La risposta non nasce dal nulla. <strong>Nasce dalla ricerca delle fonti pertinenti</strong>, che rimangono sempre consultabili.",
  footerLeft: "jurio.it",
  footerRight: "06 / 07"
};

const el = id => document.getElementById(id);

el('brand').textContent = CONFIG.brand;
el('meta').textContent = CONFIG.meta;
el('index').textContent = CONFIG.index;
el('eyebrow').textContent = CONFIG.eyebrow;
el('title').innerHTML = CONFIG.title;
el('text').innerHTML = CONFIG.text;
el('footerLeft').textContent = CONFIG.footerLeft;
el('footerRight').textContent = CONFIG.footerRight;

// Gestione dinamica dei punti: nasconde il blocco e il separatore se l'array è vuoto
if (!CONFIG.points || CONFIG.points.length === 0) {
  el('points').style.display = 'none';
  el('rule').style.display = 'none';
} else {
  el('points').style.display = 'grid';
  el('rule').style.display = 'block';
  el('points').innerHTML = CONFIG.points.map(p => `
    <article class="point">
      <div class="point-num">${p.num}</div>
      <div class="point-title">${p.title}</div>
      <div class="point-desc">${p.desc}</div>
    </article>`).join('');
}

// Gestione dinamica del callout: nasconde il blocco se non valorizzato
if (!CONFIG.callout || CONFIG.callout.trim() === '') {
  el('callout').style.display = 'none';
} else {
  el('callout').style.display = 'flex';
  el('calloutText').innerHTML = CONFIG.callout;
}
</script>
</body>
</html>
