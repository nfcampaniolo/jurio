<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">

<title>Jurio — Blog Cover (Brown & Azzurro Italia)</title>

<style>
:root{
  /* Palette Marrone Editoriale & Azzurro Nazionale */
  --bg:#1a1310;              /* Testa di moro profondo / dark espresso */
  --bg-dark:#100b09;         /* Nero caldo per vignettature e gradienti */
  --text:#f5f0e9;            /* Bianco avorio caldo */
  --muted:#9e9185;           /* Tortora caldo desaturato */
  --azzurro:#1e74ea;         /* Azzurro Savoia / Nazionale brillante */

  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Lora",Georgia,serif;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#0c0907;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family:var(--sans);
}

.slide{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:absolute;
  top:58px;
  left:72px;
  right:72px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.03em;
  color:var(--text);
}

.logo-mark{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:9px;
  border-radius:50%;
  background:var(--azzurro);
  box-shadow:0 0 10px rgba(30,116,234,.45);
}

.source{
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}

/* =========================================================
   CONTENUTO TESTUALE (PARTE SUPERIORE)
   ========================================================= */

.content{
  position:absolute;
  left:72px;
  right:72px;
  top:180px;

  max-width:920px;
  z-index:8;
}

.eyebrow{
  margin-bottom:24px;

  font-size:14px;
  line-height:1;

  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;

  color:var(--azzurro);
}

h1{
  margin:0;
  max-width:880px;

  font-family:var(--serif);
  font-size:76px;
  line-height:1.04;
  letter-spacing:-.05em;
  font-weight:500;
  color:var(--text);

  text-shadow:0 2px 5px rgba(0,0,0,.5);
}

h1 em{
  color:var(--azzurro);
  font-style:italic;
}

.lead{
  max-width:760px;
  margin:28px 0 0;

  font-size:27px;
  line-height:1.44;

  color:#c7bcb0;
}

.lead strong{
  color:var(--text);
}

.actions{
  display:flex;
  align-items:center;
  gap:36px;
  margin-top:34px;
}

.source-line{
  display:flex;
  align-items:center;
  gap:11px;

  font-size:14px;
  line-height:1.4;

  color:var(--muted);
}

.source-line::before{
  content:"";
  width:24px;
  height:2px;
  background:var(--azzurro);
  flex:none;
}

.source-line strong{
  color:var(--text);
}

.cta{
  display:inline-flex;
  align-items:center;
  gap:9px;

  color:var(--text);
  text-decoration:none;

  font-size:16px;
  font-weight:700;
}

.cta span{
  color:var(--azzurro);
  font-size:21px;
}

/* =========================================================
   IMMAGINE — IN BASSO CON TAGLIO DINAMICO E SFUMATURA
   ========================================================= */

.image{
  position:absolute;
  bottom:-20px;
  left:-20px;
  right:-20px;
  height:52%;

  overflow:hidden;

  /* Taglio diagonale dinamico verso il basso a sinistra */
  clip-path:polygon(
    0 16%,
    100% 0,
    100% 100%,
    0 100%
  );

  z-index:2;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transform:scale(1.05);

  filter:
    blur(2.5px)
    saturate(.7)
    brightness(.72)
    contrast(1.06);
}

/* Gradiente superiore: fonde l'immagine nello sfondo marrone */
.image::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;

  background:
    linear-gradient(
      180deg,
      rgba(26,19,16,1) 0%,
      rgba(26,19,16,.75) 20%,
      rgba(26,19,16,.2) 48%,
      rgba(26,19,16,0) 70%
    );
}

/* Gradiente inferiore: protegge il footer garantendo massimo contrasto */
.image::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;

  background:
    linear-gradient(
      0deg,
      rgba(16,11,9,.85) 0%,
      rgba(16,11,9,.35) 24%,
      transparent 50%
    );
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
  position:absolute;
  left:72px;
  right:72px;
  bottom:52px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:var(--text);
  z-index:10;
}

.footer-left{
  font-size:14px;
  font-weight:700;
  letter-spacing:-.01em;
}

.footer-right{
  font-size:14px;
  color:#a59a90;
}

/* =========================================================
   MODALITÀ CHIUSURA (SENZA IMMAGINE)
   ========================================================= */

.mode-fine .image{
  display:none;
}

.mode-fine .content{
  top:260px;
  max-width:760px;
}

@media(max-width:900px){
  .slide{
    transform:scale(.72);
    transform-origin:top left;
    margin-bottom:-370px;
  }
}
</style>
</head>

<body>

<div class="slide">

  <header class="header">

    <div class="logo">
      <span class="logo-mark"></span>Jurio
    </div>

    <div class="source">
      Fonti · Jurio
    </div>

  </header>

  <main class="content">

    <div class="eyebrow" id="eyebrow">
      Giurisprudenza
    </div>

    <h1 id="title"></h1>

    <p class="lead" id="lead"></p>

    <div class="actions">
      <div class="source-line">
        Sintesi basata sulle
        <strong>fonti analizzate da Jurio</strong>
      </div>

      <a class="cta" id="cta" href="#">
        Leggi l'analisi completa
        <span>↗</span>
      </a>
    </div>

  </main>

  <div class="image" id="imageWrap">
    <img id="image" alt="">
  </div>

  <footer class="footer">
    <div class="footer-left">jurio.it</div>
    <div class="footer-right" id="page">01 / 07</div>
  </footer>

</div>

<script>

const CONFIG = {
  mode:"intro",
  eyebrow:"Giurisprudenza",
  title:"Fideiussioni ABI: le <em>Sezioni Unite</em> cambiano le regole",
  lead:"Stop agli automatismi sulla nullità delle garanzie. La Cassazione ridefinisce il peso del precedente del 2005.",
  image:"https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcRXBOxQCR6rf6fttr-rnltjqiG3xcW4ijSnhfZfOpDlhk3V3LGDPlNaZkoOsJfoaQgY8RK2ZiBW4SJ_FkQ",
  ctaHref:"https://www.jurio.it",
  page:"01 / 07"
};

const el = id => document.getElementById(id);

if(CONFIG.mode === "fine"){
  document.body.classList.add("mode-fine");
}

el("eyebrow").textContent = CONFIG.eyebrow;
el("title").innerHTML = CONFIG.title;
el("lead").innerHTML = CONFIG.lead;
el("image").src = CONFIG.image;
el("image").alt = CONFIG.title.replace(/<[^>]*>/g,"");
el("cta").href = CONFIG.ctaHref;
el("page").textContent = CONFIG.page;

</script>

</body>
</html>
