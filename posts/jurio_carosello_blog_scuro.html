<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">

<title>Jurio — Blog Cover (Dark)</title>

<style>
:root{
  --bg:#101216;
  --text:#f2f3f5;
  --muted:#8e95a2;
  --gold:#d89424;

  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Lora",Georgia,serif;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#07080a;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family:var(--sans);
}

.slide{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:var(--bg);
}

/* =========================================================
   IMMAGINE — LATO SINISTRO CON TAGLIO SPECCHIATO
   ========================================================= */

.image{
  position:absolute;
  top:-20px;
  left:-20px;
  width:52%;
  height:calc(100% + 40px);

  overflow:hidden;

  /* Specchiatura orizzontale del taglio */
  clip-path:polygon(
    0 0,
    82% 0,
    100% 100%,
    0 100%
  );

  z-index:1;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transform:scale(1.04);

  /* Calibrato per non risultare accecante su fondo scuro */
  filter:
    blur(3px)
    saturate(.68)
    brightness(.78)
    contrast(1.04);
}

/* Gradiente verso destra per fondersi con lo sfondo scuro */
.image::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;

  background:
    linear-gradient(
      270deg,
      rgba(16,18,22,.98) 0%,
      rgba(16,18,22,.74) 18%,
      rgba(16,18,22,.24) 40%,
      rgba(16,18,22,0) 60%
    );
}

/* Velo scuro per uniformare i neri dell'immagine */
.image::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;

  background:rgba(0,0,0,.22);
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:absolute;
  top:58px;
  left:72px;
  right:72px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:var(--text);
  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.03em;
}

.logo-mark{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:9px;
  border-radius:50%;
  background:var(--gold);
}

.source{
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}

/* =========================================================
   TESTO — ANCORATO A DESTRA
   ========================================================= */

.content{
  position:absolute;
  right:72px;
  top:215px;

  width:52%;
  max-width:565px;

  z-index:8;
}

.eyebrow{
  margin-bottom:28px;

  font-size:14px;
  line-height:1;

  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;

  color:var(--gold);
}

h1{
  margin:0;

  max-width:560px;

  font-family:var(--serif);
  font-size:80px;
  line-height:1.02;
  letter-spacing:-.055em;
  font-weight:500;
  color:var(--text);

  text-shadow:0 2px 4px rgba(0,0,0,.45);
}

h1 em{
  color:var(--gold);
  font-style:italic;
}

.lead{
  max-width:530px;

  margin:32px 0 0;

  font-size:28px;
  line-height:1.43;

  color:#b4b9c4;
}

.lead strong{
  color:var(--text);
}

.source-line{
  margin-top:38px;

  display:flex;
  align-items:center;
  gap:11px;

  font-size:14px;
  line-height:1.4;

  color:var(--muted);
}

.source-line::before{
  content:"";
  width:24px;
  height:2px;

  background:var(--gold);
  flex:none;
}

.source-line strong{
  color:var(--text);
}

/* =========================================================
   CTA
   ========================================================= */

.cta{
  display:inline-flex;
  align-items:center;
  gap:9px;

  margin-top:34px;

  color:var(--text);
  text-decoration:none;

  font-size:16px;
  font-weight:700;
}

.cta span{
  color:var(--gold);
  font-size:21px;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
  position:absolute;
  left:72px;
  right:72px;
  bottom:52px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:var(--text);
  z-index:10;
}

.footer-left{
  font-size:14px;
  font-weight:700;
}

.footer-right{
  font-size:14px;
  color:#666d79;
}

/* =========================================================
   MODALITÀ CHIUSURA (NO IMMAGINE)
   ========================================================= */

.mode-fine .image{
  display:none;
}

.mode-fine .content{
  top:255px;
  left:72px;
  right:auto;
  width:65%;
  max-width:680px;
}

.mode-fine h1{
  font-size:76px;
}

.mode-fine .lead{
  font-size:28px;
  max-width:600px;
}

@media(max-width:900px){
  .slide{
    transform:scale(.72);
    transform-origin:top left;
    margin-bottom:-370px;
  }
}
</style>
</head>

<body>

<div class="slide">

  <div class="image" id="imageWrap">
    <img id="image" alt="">
  </div>

  <header class="header">

    <div class="logo">
      <span class="logo-mark"></span>Jurio
    </div>

    <div class="source">
      Fonti · Jurio
    </div>

  </header>

  <main class="content">

    <div class="eyebrow" id="eyebrow">
      Giurisprudenza
    </div>

    <h1 id="title"></h1>

    <p class="lead" id="lead"></p>

    <div class="source-line">
      Sintesi basata sulle
      <strong>fonti analizzate da Jurio</strong>
    </div>

    <a class="cta" id="cta" href="#">
      Leggi l'analisi completa
      <span>↗</span>
    </a>

  </main>

  <footer class="footer">
    <div class="footer-left">jurio.it</div>
    <div class="footer-right" id="page">01 / 07</div>
  </footer>

</div>

<script>

const CONFIG = {
  mode:"intro",
  eyebrow:"Giurisprudenza",
  title:"Fideiussioni ABI: le <em>Sezioni Unite</em> cambiano le regole",
  lead:"Stop agli automatismi sulla nullità delle garanzie. La Cassazione ridefinisce il peso del precedente del 2005.",
  image:"https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcRXBOxQCR6rf6fttr-rnltjqiG3xcW4ijSnhfZfOpDlhk3V3LGDPlNaZkoOsJfoaQgY8RK2ZiBW4SJ_FkQ",
  ctaHref:"https://www.jurio.it",
  page:"01 / 07"
};

const el = id => document.getElementById(id);

if(CONFIG.mode === "fine"){
  document.body.classList.add("mode-fine");
}

el("eyebrow").textContent = CONFIG.eyebrow;
el("title").innerHTML = CONFIG.title;
el("lead").innerHTML = CONFIG.lead;
el("image").src = CONFIG.image;
el("image").alt = CONFIG.title.replace(/<[^>]*>/g,"");
el("cta").href = CONFIG.ctaHref;
el("page").textContent = CONFIG.page;

</script>

</body>
</html>
