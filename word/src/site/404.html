<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Pagina non trovata · Jurio per Word</title>
  <style>
    :root { --bg: #f5f6f7; --text: #1a1d21; --muted: #5f6672; --primary: #8a5c16; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #e6e7ea; --muted: #a1a7b0; --primary: #e0a32e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { font-family: "Lora", Georgia, serif; font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div>
    <h1>Pagina non trovata</h1>
    <p>Questo indirizzo ospita solo il componente aggiuntivo di Jurio per Word.</p>
    <a href="/">Istruzioni di installazione</a>
  </div>
</body>
</html>
