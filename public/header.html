<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Jurio — home">
      Jurio
    </a>
    <!-- Navigazione desktop -->
    <nav class="nav" aria-label="Navigazione principale">
      <a href="/#come-funziona">Come funziona</a>
      <a href="/prezzi">Prezzi</a>
      <a href="/#faq">FAQ</a>
      <a href="/ricerca">Ricerca giurisprudenza</a>
      <a href="/chat">Consulente legale</a>
    </nav>
    <a class="header-cta" href="/profilo">
      Accedi
    </a>
    <!-- Menu mobile -->
    <details class="mobile-menu">
      <summary aria-label="Apri menu">
     </summary>
      <nav class="mobile-nav" aria-label="Navigazione mobile">
        <a href="/#come-funziona">Come funziona</a>
        <a href="/prezzi">Prezzi</a>
        <a href="/#faq">FAQ</a>
        <a href="/ricerca">Ricerca giurisprudenza</a>
        <a href="/chat">Consulente legale</a>
        <span class="mobile-divider"></span>
        <a class="mobile-login" href="/profilo">Accedi</a>
      </nav>
    </details>
  </div>
  <style>
    /* =====================================================
       JURIO HEADER
       ===================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background: color-mix(
        in srgb,
        var(--color-surface) 88%,
        transparent
      );
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-inner {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 2rem;
    }

    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      flex-shrink: 0;

      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 700;
      line-height: 1;

      letter-spacing: -.03em;

      text-decoration: none;

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .brand:hover {
      opacity: .82;
      transform: translateY(-1px);
    }

    /* =====================================================
       DESKTOP NAV
       ===================================================== */

    .nav {
      display: flex;
      align-items: center;

      gap: 1.7rem;

      margin-left: auto;
      margin-right: auto;
    }

    .nav a {
      position: relative;

      color: var(--color-muted);

      font-family: var(--font-sans);
      font-size: .72rem;
      font-weight: 800;

      letter-spacing: .14em;
      text-transform: uppercase;

      text-decoration: none;

      transition: color .18s ease;
    }

    .nav a::after {
      content: "";

      position: absolute;
      left: 0;
      right: 0;
      bottom: -.55rem;

      height: 1px;

      background: var(--color-primary);

      transform: scaleX(0);
      transform-origin: right;

      transition:
        transform .25s ease;
    }

    .nav a:hover {
      color: var(--color-text);
    }

    .nav a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Accento sulle funzioni principali */
    .nav a[href="/analisi"],
    .nav a[href="/chat"] {
      color: var(--color-text);
    }

    .nav a[href="/analisi"]::before,
    .nav a[href="/chat"]::before {
      content: "";

      display: inline-block;

      width: 5px;
      height: 5px;

      margin-right: .45rem;

      vertical-align: middle;

      border-radius: 50%;
      background: var(--color-primary);

      transform: translateY(-1px);
    }

    /* =====================================================
       CTA
       ===================================================== */

    .header-cta {
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 44px;
      padding: 0 1.1rem;

      border-radius: 10px;

      background: var(--button-bg);
      color: var(--button-text);

      font-family: var(--font-sans);
      font-size: .9rem;
      font-weight: 750;

      text-decoration: none;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .header-cta:hover {
      background: var(--button-bg-hover);

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px rgba(36, 33, 29, .10);
    }

    /* =====================================================
       MOBILE MENU BUTTON
       ===================================================== */

    .mobile-menu {
      display: none;

      position: relative;
      flex-shrink: 0;
    }

    .mobile-menu summary {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;

      cursor: pointer;
      list-style: none;

      color: var(--color-text);

      border-radius: 10px;

      background: var(--color-surface);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    .mobile-menu summary::-webkit-details-marker {
      display: none;
    }

    .mobile-menu summary:hover {
      background: var(--color-bg);
      border-color: var(--color-primary);
    }

    .mobile-menu summary:active {
      transform: scale(.96);
    }

    .menu-icon {
      display: block;

      width: 20px;
      height: 20px;

      margin: 0;
      padding: 0;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    /* =====================================================
       MOBILE DROPDOWN
       ===================================================== */

    .mobile-nav {
      position: absolute;

      top: calc(100% + 10px);
      right: 0;

      width: min(340px, calc(100vw - 28px));

      display: flex;
      flex-direction: column;

      padding: .55rem;

      background: var(--color-surface);

      border: 1px solid var(--color-border);
      border-radius: 16px;

      box-shadow: var(--shadow-soft);

      transform-origin: top right;

      animation:
        jurio-menu-in .2s var(--ease-smooth, ease-out);
    }

    @keyframes jurio-menu-in {
      from {
        opacity: 0;
        transform:
          translateY(-8px)
          scale(.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .mobile-nav a {
      display: flex;
      align-items: center;

      min-height: 46px;

      padding: .65rem .85rem;

      color: var(--color-text);

      font-family: var(--font-sans);
      font-size: .86rem;
      font-weight: 650;

      line-height: 1.3;

      text-decoration: none;

      border-radius: 9px;

      transition:
        background .16s ease,
        color .16s ease,
        padding-left .16s ease;
    }

    .mobile-nav a:hover {
      background: color-mix(
        in srgb,
        var(--color-bg) 70%,
        transparent
      );

      color: var(--color-primary);

      padding-left: 1rem;
    }

    /* Separatore */
    .mobile-divider {
      height: 1px;

      margin: .45rem .65rem;

      background: var(--color-border);
    }

    /* Bottone Accedi mobile */
    .mobile-login {
      justify-content: center;

      margin-top: .15rem;

      background: var(--button-bg) !important;
      color: var(--button-text) !important;

      font-weight: 750 !important;
    }

    .mobile-login:hover {
      background: var(--button-bg-hover) !important;
      color: var(--button-text) !important;

      padding-left: .85rem !important;
    }

    /* =====================================================
       BREAKPOINT
       ===================================================== */

    @media (max-width: 900px) {
      .nav,
      .header-cta {
        display: none;
      }

      .mobile-menu {
        display: block;
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 720px) {
      .header-inner {
        min-height: 70px;
      }

      .brand {
        font-size: 1.8rem;
      }

      .mobile-nav {
        width: min(340px, calc(100vw - 28px));
      }
    }

    /* =====================================================
       ACCESSIBILITÀ
       ===================================================== */

    .brand:focus-visible,
    .nav a:focus-visible,
    .header-cta:focus-visible,
    .mobile-menu summary:focus-visible,
    .mobile-nav a:focus-visible {
      outline: 3px solid rgba(154, 107, 37, .55);
      outline-offset: 3px;
    }

    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      .brand,
      .nav a,
      .header-cta,
      .mobile-menu summary,
      .mobile-nav a {
        transition: none;
      }

      .mobile-nav {
        animation: none;
      }
    }
  </style>
</header>
